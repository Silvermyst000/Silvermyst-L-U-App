<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient extends to full bleed edges without corner radius -->
    <linearGradient id="maskableBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for Android squircle / circle mask -->
  <rect width="512" height="512" fill="url(#maskableBgGrad)" />

  <!-- Content group centered within 80% safe zone (20% margin around edges) -->
  <g transform="translate(51, 51) scale(0.8)">
    <circle cx="256" cy="230" r="180" fill="url(#centerGlow)" />

    <!-- Dynamic Aero Sweeps / Car Silhouette Arcs -->
    <path d="M 90 280 C 170 190, 310 160, 422 210" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 120 305 C 210 225, 340 195, 410 232" fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" />
    <path d="M 160 325 C 230 265, 320 240, 385 260" fill="none" stroke="url(#neonPink)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Central Silver Star Emblem -->
    <g transform="translate(256, 215) scale(1.15)">
      <path d="M 0 -70 L 16 -18 L 68 -18 L 26 14 L 42 66 L 0 34 L -42 66 L -26 14 L -68 -18 L -16 -18 Z" 
            fill="url(#chromeGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      <path d="M 0 -70 L 0 34 L 42 66 L 26 14 Z" fill="#ffffff" opacity="0.4" />
      <circle cx="0" cy="8" r="6" fill="#38bdf8" />
    </g>

    <text x="256" y="380" text-anchor="middle" font-family="'Outfit', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
      SILVERMYST
    </text>
    <text x="256" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="6" fill="#38bdf8">
      MULTISERVICES
    </text>
  </g>
</svg>
