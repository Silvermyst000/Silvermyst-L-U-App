<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <!-- Chrome / Silver Gradient for Star & Arcs -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Sky Neon Arc Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Magenta Accent Glow Gradient -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Rim Glow Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="256" cy="230" r="180" fill="url(#centerGlow)" />

  <!-- Dynamic Aero Sweeps / Car Silhouette Arcs -->
  <path d="M 90 280 C 170 190, 310 160, 422 210" fill="none" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 120 305 C 210 225, 340 195, 410 232" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 160 325 C 230 265, 320 240, 385 260" fill="none" stroke="url(#neonPink)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Central Silver Star Emblem -->
  <g transform="translate(256, 215) scale(1.15)">
    <!-- Shadow Star -->
    <path d="M 0 -70 L 16 -18 L 68 -18 L 26 14 L 42 66 L 0 34 L -42 66 L -26 14 L -68 -18 L -16 -18 Z" 
          fill="#0284c7" opacity="0.3" filter="url(#glow)" transform="translate(0, 4)" />
    <!-- Main Chrome Star -->
    <path d="M 0 -70 L 16 -18 L 68 -18 L 26 14 L 42 66 L 0 34 L -42 66 L -26 14 L -68 -18 L -16 -18 Z" 
          fill="url(#chromeGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Facet Highlight Right -->
    <path d="M 0 -70 L 0 34 L 42 66 L 26 14 Z" fill="#ffffff" opacity="0.4" />
    <path d="M 0 -70 L 16 -18 L 68 -18 L 26 14 Z" fill="#ffffff" opacity="0.25" />
    <!-- Center Point Jewel -->
    <circle cx="0" cy="8" r="6" fill="#38bdf8" />
  </g>

  <!-- Typography: SILVERMYST -->
  <text x="256" y="380" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    SILVERMYST
  </text>
  <text x="256" y="410" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="6" fill="#38bdf8">
    MULTISERVICES
  </text>
</svg>
